models:
  - type: main
    engine: google_genai
    model: gemini-3.1-flash-lite
    parameters:
      temperature: 0.1
      # Gemini 2.5 Flash mặc định "suy nghĩ" trước khi trả lời, và token suy nghĩ
      # bị tính vào max_tokens. Self-check chỉ cho vài token nên nếu không tắt,
      # model trả về rỗng và rail chặn nhầm mọi câu hỏi.
      thinking_budget: 0

instructions:
  - type: general
    content: |
      Bạn là một trợ lý ảo chăm sóc khách hàng cho dịch vụ ngân hàng.
      Bạn chỉ trả lời các thông tin liên quan đến dịch vụ tài chính, thẻ và tài khoản.
      Bạn không bao giờ tiết lộ thông tin tài khoản, số dư hay giao dịch của khách hàng khác.

# Input/output rails có sẵn của NeMo. Chúng chạy thêm một lượt gọi LLM
# với prompt trong prompts.yml, độc lập với dialog rails trong rails.co.
rails:
  input:
    flows:
      - self check input
  output:
    flows:
      - self check output
